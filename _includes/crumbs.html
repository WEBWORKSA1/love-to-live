<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{% for cr in page.crumbs %}{"@type":"ListItem","position":{{ forloop.index }},"name":{{ cr[0] | jsonify }},"item":"{{ site.site_url }}/{{ cr[1] }}"}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>{% endif %}
